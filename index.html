<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <header>
            <p class="tagline">THE ULTIMATE BATTLE</p>
            <h1>Rock <span>Paper</span> Scissors</h1>
            <p class="subtitle">Choose your move and beat the computer!</p>
        </header>

        <section class="score-board">
            <div class="score-card">
                <p>YOU</p>
                <h2 id="player-score">0</h2>
            </div>

            <div class="vs">VS</div>

            <div class="score-card">
                <p>COMPUTER</p>
                <h2 id="computer-score">0</h2>
            </div>
        </section>

        <section class="battle-area">
            <div class="player-choice">
                <div class="choice-circle" id="player-choice">
                    ?
                </div>
                <p>Your Choice</p>
            </div>

            <div class="battle-text">VS</div>

            <div class="player-choice">
                <div class="choice-circle" id="computer-choice">
                    ?
                </div>
                <p>Computer Choice</p>
            </div>
        </section>

        <div class="result-box" id="result">
            Make your move!
        </div>

        <p class="choose-text">CHOOSE YOUR WEAPON</p>

        <section class="choices">
            <button class="choice-btn" data-choice="rock"
                    aria-label="Choose Rock">
                <span>✊</span>
                <small>ROCK</small>
            </button>

            <button class="choice-btn" data-choice="paper"
                    aria-label="Choose Paper">
                <span>✋</span>
                <small>PAPER</small>
            </button>

            <button class="choice-btn" data-choice="scissors"
                    aria-label="Choose Scissors">
                <span>✌️</span>
                <small>SCISSORS</small>
            </button>
        </section>

        <button id="reset-btn" class="reset-btn">
            ↻ Reset Game
        </button>

        <footer>
            Made with ❤️ using HTML, CSS & JavaScript
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
